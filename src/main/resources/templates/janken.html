<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Janken</title>
</head>

<body>
  <h1>Janken GAME!</h1>
  <p th:if="${input_name}">Hi <span th:text="${input_name}"></span></p>

  <a href="/janken?hand=グー">ぐー</a>
  <a href="/janken?hand=チョキ">ちょき</a>
  <a href="/janken?hand=パー">ぱー</a>

  <div th:if="${your_hand}">
    <p>あなたの手: <span th:text="${your_hand}"></span></p>
    <p>相手の手: <span th:text="${cpu_hand}"></span></p>
    <p>結果: <span th:text="${result}"></span></p>
  </div>

</body>

</html>

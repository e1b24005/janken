<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Match</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Match</h1>
  <h2><span th:text="${loginUserName}"></span> V.S. <span th:text="${opponent.name}"></span></h2>
  <a th:href="@{/wait(id=${opponent.id}, hand='Gu')}">ぐー</a>
  <a th:href="@{/wait(id=${opponent.id}, hand='Choki')}">ちょき</a>
  <a th:href="@{/wait(id=${opponent.id}, hand='Pa')}">ぱー</a>

  <div th:if="${your_hand}">
    <p>あなたの手 <span th:text="${your_hand}"></span></p>
    <p>相手の手 <span th:text="${cpu_hand}"></span></p>
    <p>結果 <span th:text="${result}"></span></p>
  </div>
  <div>
    <a href="/janken">もどる</a>
  </div>
</body>

</html>
